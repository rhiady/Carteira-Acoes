#conexao ao postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cotacao}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# gera log
logging.file.name=suporteos_dev.log
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO

# SQL e valores de bind nao sao exibidos por padrao para evitar vazamento em logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
