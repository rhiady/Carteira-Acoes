
name: testes

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: Carteira-acoes-backend/pom.xml

      - run: ./mvnw --batch-mode clean verify
        working-directory: Carteira-acoes-backend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-jacoco
          path: Carteira-acoes-backend/target/site/jacoco/
